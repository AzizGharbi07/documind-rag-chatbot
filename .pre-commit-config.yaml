# Install once with `just setup` (or `cd backend && uv run pre-commit install`).
# Local hooks call the tools pinned in backend/uv.lock and frontend/package-lock.json,
# so hooks, CI and your editor always agree on versions.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: detect-private-key

  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format (backend)
        entry: uv run --directory backend ruff format .
        language: system
        files: ^backend/.*\.py$
        pass_filenames: false
      - id: ruff-check
        name: ruff check (backend)
        entry: uv run --directory backend ruff check --fix .
        language: system
        files: ^backend/.*\.py$
        pass_filenames: false
      - id: mypy
        name: mypy (backend)
        entry: uv run --directory backend mypy app tests
        language: system
        files: ^backend/.*\.py$
        pass_filenames: false
      - id: prettier
        name: prettier (frontend)
        entry: npm --prefix frontend run format
        language: system
        files: ^frontend/
        pass_filenames: false
      - id: oxlint
        name: oxlint (frontend)
        entry: npm --prefix frontend run lint
        language: system
        files: ^frontend/.*\.(ts|tsx)$
        pass_filenames: false
